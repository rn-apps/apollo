# Generated by kiln 0.1.0 from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
version: "3"

# The only entrypoint. Nobody — human, agent or CI — invokes `uv`, `pytest`,
# `ruff`, `pyright`, `mkdocs` or `kiln` directly; `kiln doctor`'s `ci-entrypoint`
# check enforces that for every workflow file.
#
# This file holds wrappers only: every task below is a list of calls into
# tasks/*.yml. Anything that shells out lives in the namespace file that owns
# it. Namespaces whose public name is already correct (docs:*) are reached
# through the include directly and carry no wrapper here.
#
# The vocabulary is fixed; see .rn-forge/kiln/standard.md.

env:
  # Keeping the uv cache inside the repo avoids competing with other checkouts
  # for a shared cache dir. Tasks that must not share it (packaging) override
  # this locally.
  UV_CACHE_DIR: .uv-cache

# The kiln commands every namespace file calls, declared once so a pin changes
# this file alone. go-task passes these to each included file; a namespace file
# that declared its own would shadow them.
vars:
  KILN: 'uvx --from "rn-forge-kiln @ git+https://github.com/rn-forge/kiln@3a11258b9a09cefb9f4818a74317708564798e4c" kiln'
  DEVOPS: 'uvx --from "rn-forge-kiln @ git+https://github.com/rn-forge/kiln@3a11258b9a09cefb9f4818a74317708564798e4c" kiln-devops'

includes:
  quality: tasks/quality.yml
  python: tasks/python.yml
  kiln: tasks/kiln.yml
  docs: tasks/docs.yml
  workspace: tasks/workspace.yml
  ci: tasks/ci.yml
  sonar: tasks/sonar.yml
  api: tasks/api.yml
  web: tasks/web.yml
  node: tasks/node.yml

tasks:
  setup:
    desc: Install the project and its dev + docs dependency groups.
    cmds:
      - task: python:install
      - task: node:install

  validate:
    desc: The aggregate gate — lint, typecheck, test, docs build. Any failure fails.
    cmds:
      - task: workspace:banner
        vars: {STEP: "lint", N: 1, OF: 4}
      - task: lint
      - task: workspace:banner
        vars: {STEP: "typecheck", N: 2, OF: 4}
      - task: typecheck
      - task: workspace:banner
        vars: {STEP: "test", N: 3, OF: 4}
      - task: test
      - task: workspace:banner
        vars: {STEP: "docs:build", N: 4, OF: 4}
      - task: docs:build

  lint:
    desc: Every lint — Python, imports, the frontend's Nx lint, Prettier formatting, the generated API client, Markdown, TOML and YAML formatting, kiln's checks (generated files, task layout, CI, dependencies, docs), workflow security, dependency vulnerabilities, dependency licences.
    cmds:
      - task: workspace:step
        vars: {STEP: "python:lint", N: 1, OF: 14}
      - task: python:lint
      - task: workspace:step
        vars: {STEP: "python:lint:imports", N: 2, OF: 14}
      - task: python:lint:imports
      - task: workspace:step
        vars: {STEP: "node:lint", N: 3, OF: 14}
      - task: node:lint
      - task: workspace:step
        vars: {STEP: "node:lint:format", N: 4, OF: 14}
      - task: node:lint:format
      - task: workspace:step
        vars: {STEP: "web:client:check", N: 5, OF: 14}
      - task: web:client:check
      - task: workspace:step
        vars: {STEP: "quality:lint:markdown", N: 6, OF: 14}
      - task: quality:lint:markdown
      - task: workspace:step
        vars: {STEP: "quality:lint:toml", N: 7, OF: 14}
      - task: quality:lint:toml
      - task: workspace:step
        vars: {STEP: "quality:lint:yaml", N: 8, OF: 14}
      - task: quality:lint:yaml
      - task: workspace:step
        vars: {STEP: "kiln:doctor", N: 9, OF: 14}
      - task: kiln:doctor
      - task: workspace:step
        vars: {STEP: "ci:lint:workflows", N: 10, OF: 14}
      - task: ci:lint:workflows
      - task: workspace:step
        vars: {STEP: "python:lint:audit", N: 11, OF: 14}
      - task: python:lint:audit
      - task: workspace:step
        vars: {STEP: "node:lint:audit", N: 12, OF: 14}
      - task: node:lint:audit
      - task: workspace:step
        vars: {STEP: "python:lint:licenses", N: 13, OF: 14}
      - task: python:lint:licenses
      - task: workspace:step
        vars: {STEP: "node:lint:licenses", N: 14, OF: 14}
      - task: node:lint:licenses

  format:
    desc: Format Python code, Prettier-formatted files, TOML, YAML and Markdown prose in place.
    cmds:
      - task: python:format
      - task: node:format
      - task: quality:format:markdown
      - task: quality:format:toml
      - task: quality:format:yaml

  typecheck:
    desc: Type-check the API in pyright strict mode and the frontend through its Angular build.
    cmds:
      - task: python:typecheck
      - task: node:typecheck

  test:
    desc: Run the API's pytest suite and the frontend's tests; pytest arguments after -- go to the API suite.
    cmds:
      - task: python:test
      - task: node:test

  test:coverage:
    desc: Run both test suites with coverage reports (used by CI/Sonar).
    cmds:
      - task: python:test:coverage
      - task: node:test

  build:
    desc: Build the API's wheel and sdist, and the frontend.
    cmds:
      - task: python:build
      - task: node:build

  version:
    desc: Print the package version from pyproject.toml.
    cmds:
      - task: python:version

  clean:
    desc: Remove build outputs, caches, and the rendered docs site.
    cmds:
      - task: workspace:clean

  dev:
    desc: Run the API and the frontend dev servers together; Ctrl-C stops both.
    # deps run in parallel: each dev server blocks, so cmds could never reach
    # the second one.
    deps:
      - task: api:dev
      - task: web:dev
