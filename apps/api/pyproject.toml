[project]
name = "apollo-api"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Rohit Narayanan", email = "rohit.nn@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "rn-forge-commons>=0.10.0,<0.11",
    "rn-forge-cli>=0.2.0,<0.3",
    "rn-forge-web>=0.3.2,<0.4",
    "rn-forge-fastapi[sse]>=0.5.0,<0.6",
    "beets>=2.13.1",
    "mediafile>=0.17.0",
    "mutagen>=1.48.1",
    "pydantic-settings>=2.16.3",
    "httpx>=0.28.1",
    "python-multipart>=0.0.34",
    "yt-dlp>=2026.10.26",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
apollo-api = "apollo_api:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
reportMissingTypeStubs = false
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "../.."

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D", "PLR2004", "S101"]

[tool.uv.build-backend]
module-name = "apollo_api"
source-exclude = ["**/.DS_Store"]

[dependency-groups]
dev = []
