# Generated by kiln 0.1.0 from .rn-forge/kiln/config.toml — do not edit; run 'kiln apply'
version: "3"

# The internal implementation namespace: the uv toolchain the root wrappers
# compose. Everything here is `internal: true` — it exists to be called from a
# wrapper, not run directly.

vars:
  DEVOPS: 'uvx --from "rn-forge-kiln @ git+https://github.com/rn-forge/kiln@feature/v1" kiln-devops'

tasks:
  install:
    desc: Sync the workspace with the dev and docs dependency groups.
    internal: true
    cmds:
      - uv sync --all-packages --group dev --group docs

  lint:
    desc: Lint the API package with ruff, and check formatting.
    internal: true
    cmds:
      - uv run --directory apps/api --package apollo-api ruff check src $(test -d apps/api/tests && echo tests)
      - uv run --directory apps/api --package apollo-api ruff format --check src $(test -d apps/api/tests && echo tests)

  lint:imports:
    desc: Enforce the import-boundary contracts in .importlinter.
    internal: true
    cmds:
      - uv run lint-imports

  lint:audit:
    desc: Fail if a locked dependency has a known vulnerability (pip-audit; needs the network).
    internal: true
    # `set -o pipefail`: go-task's shell takes only the last command's status
    # from a pipeline, so a failing `uv export` would otherwise audit nothing
    # and pass.
    cmds:
      - >-
        set -o pipefail;
        uv export --frozen --all-packages --all-groups --all-extras --no-emit-workspace --no-header
        | uv run pip-audit --disable-pip --require-hashes --strict -r /dev/stdin

  lint:licenses:
    desc: Fail if a dependency's licence matches the deny list (pip-licenses).
    internal: true
    # `set -o pipefail`, as in `lint:audit`: a failing `pip-licenses` must not
    # let the matcher pass on empty input.
    cmds:
      - >-
        set -o pipefail;
        uv run pip-licenses --format=json
        | {{.DEVOPS}} licenses --format pip-licenses
        --deny 'GPL'
        --deny 'GPL-*'
        --deny 'AGPL'
        --deny 'AGPL-*'
        --deny 'UNKNOWN'
        --ignore 'api'
        --ignore 'apollo'
        --ignore 'apollo-api'
        --ignore 'text-unidecode'

  format:
    desc: Fix and format the API package in place with ruff.
    internal: true
    # `check --fix` first, then `format`: the linter's fixes are edits, and an
    # unused-import removal or a comprehension rewrite lands unformatted unless
    # the formatter runs after it. `lint` asserts the same pair in the
    # same order.
    cmds:
      - uv run --directory apps/api --package apollo-api ruff check --fix src $(test -d apps/api/tests && echo tests)
      - uv run --directory apps/api --package apollo-api ruff format src $(test -d apps/api/tests && echo tests)

  typecheck:
    desc: Type-check the API package with pyright in strict mode.
    internal: true
    cmds:
      - uv run --directory apps/api --package apollo-api pyright src

  test:
    desc: Run the API package's pytest suite.
    internal: true
    cmds:
      - uv run --directory apps/api --package apollo-api pytest -q {{.CLI_ARGS}}

  test:coverage:
    desc: Run the API package's tests with an XML coverage report for Sonar.
    internal: true
    # Coverage runs from the API package's own directory, same as test, so
    # its pytest settings apply. `combine` is a single-file no-op here, kept for
    # the same reason the workspace form needs it: paths stay absolute so Sonar
    # maps a line back to apps/api/src/... rather than a `src/` that exists
    # under both the API and, for python-web-app, the frontend.
    cmds:
      - rm -f "{{.ROOT_DIR}}/.coverage" "{{.ROOT_DIR}}/.coverage."* coverage.xml
      - >-
        COVERAGE_FILE="{{.ROOT_DIR}}/.coverage.apollo-api"
        uv run --directory apps/api --package apollo-api
        coverage run --rcfile "{{.ROOT_DIR}}/pyproject.toml" --source src -m pytest -q
      - uv run coverage combine
      - uv run coverage xml -o coverage.xml

  build:
    desc: Build the API package's wheel and sdist into dist/.
    internal: true
    env:
      # Packaging must not reuse the in-repo cache — `uv build` resolves against
      # a clean tree, and a shared cache has historically leaked stale metadata.
      UV_CACHE_DIR: /tmp/apollo-uv-cache
    cmds:
      - uv build --package apollo-api --out-dir dist
      - uv export --format cyclonedx1.5 --frozen --no-default-groups --package apollo-api -q -o dist/apollo-api.cdx.json

  version:
    desc: Print the API package's version from pyproject.toml.
    internal: true
    silent: true
    cmds:
      - uv version --short --package apollo-api
