version: "3"

# The API service's own dev loop. Unlike the other namespace files, this one is
# public: `api:dev` is how a developer runs it, not an internal
# step a wrapper calls. `apollo_api.app:app` is the repo's
# own module — the standard says so, kiln does not render it.

tasks:
  dev:
    desc: Run the API dev server on port 8000.
    preconditions:
      - sh: test -f apps/api/src/apollo_api/app.py
        msg: "api:dev serves apps/api/src/apollo_api/app.py, which must define the ASGI application as `app`. The application and its tests are repo-owned: create that file (README.md)."
    cmds:
      - uv run --package apollo-api uvicorn apollo_api.app:app --reload --port 8000
